# Build the current 2.06 watch image. Release publication is separate.
name: Build Watch

on:
  # Manual runs matter here: this repo is a fork, and a fork's automatic
  # triggers stay off until Actions is enabled once from the Actions tab.
  # Until then this is the only way to get the board built by CI at all.
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'documentation/**'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.board }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: esp32-s3-touch-amoled-2.06
            symbol: BOARD_TYPE_WAVESHARE_ESP32_S3_TOUCH_AMOLED_2_06
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: bash
        # Check the log and the matching board selection before packaging.
        run: |
          source $IDF_PATH/export.sh
          cd firmware
          python scripts/build.py waveshare/${{ matrix.board }} 2>&1 | tee buildpy.log
          if grep -q '\[ERROR\]' buildpy.log; then
            echo 'build.py reported errors' >&2
            exit 1
          fi
          test -f build/xiaozhi.bin
          test -f build/merged-binary.bin
          grep -q '^CONFIG_${{ matrix.symbol }}=y$' sdkconfig
          grep -q '^CONFIG_VOICEMODE_CODEX_VOICE=y$' sdkconfig
          grep -q '^CONFIG_USE_DEVICE_AEC=y$' sdkconfig
          grep -q '^CONFIG_USE_DEFAULT_MESSAGE_STYLE=y$' sdkconfig

      # The display test uses fonts fetched by the firmware build above.
      - name: Host tests
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python -m pip install --disable-pip-version-check pillow
          cd firmware
          python scripts/tests/run_host_tests.py
